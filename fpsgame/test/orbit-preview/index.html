<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gun orbit preview</title>
  <style>
    body { margin: 0; background: #202530; color: #cde; font: 14px monospace; overflow: hidden; }
    #log { position: fixed; left: 8px; top: 8px; white-space: pre; z-index: 10;
           background: rgba(0,0,0,.5); padding: 8px; border-radius: 6px; }
    #pick { position: fixed; right: 8px; top: 8px; z-index: 10; }
    button { font: inherit; margin: 2px; padding: 4px 10px; cursor: pointer; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <div id="log">loading…</div>
  <div id="pick">
    <button data-g="../models/rifle.glb">rifle</button>
    <button data-g="../models/pistol.glb">pistol</button>
    <button data-g="../models/sniper.glb">sniper</button>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const logEl = document.getElementById('log');
    const log = (...a) => { logEl.textContent = a.join(' '); console.log('[orbit]', ...a); };

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202530);
    scene.add(new THREE.GridHelper(10, 10, 0x444, 0x333));
    scene.add(new THREE.AxesHelper(2)); // red=X green=Y blue=Z

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(3, 2, 3);
    const controls = new OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x334, 1.2));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 8, 5);
    scene.add(dir);

    const loader = new GLTFLoader();
    let current = null;

    function show(url) {
      if (current) { scene.remove(current); current = null; }
      log('loading', url, '…');
      loader.load(url, (gltf) => {
        const m = gltf.scene;
        m.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const ctr = box.getCenter(new THREE.Vector3());
        let meshes = 0, hidden = 0;
        m.traverse(o => { if (o.isMesh) { meshes++; if (!o.visible) hidden++; } });
        m.position.sub(ctr);
        scene.add(m);
        current = m;
        const maxd = Math.max(size.x, size.y, size.z);
        camera.position.set(maxd * 1.5, maxd * 0.8, maxd * 1.5);
        controls.target.set(0, 0, 0);
        controls.update();
        const name = url.split('/').pop();
        log(`OK ${name}\nsize ${size.x.toFixed(2)} ${size.y.toFixed(2)} ${size.z.toFixed(2)}` +
            `\nmeshes ${meshes} (hidden ${hidden})\ncenter ${ctr.x.toFixed(2)} ${ctr.y.toFixed(2)} ${ctr.z.toFixed(2)}` +
            `\n\ndrag to rotate · scroll to zoom`);
      }, undefined, (err) => log('LOAD FAILED', url, String(err)));
    }

    document.querySelectorAll('#pick button').forEach(b => b.onclick = () => show(b.dataset.g));
    show('../models/rifle.glb');

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
